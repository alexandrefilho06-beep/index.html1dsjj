<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Família Neymar 💗</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0f6, #ffc1d9);
            color: #4a2635;
            min-height: 100vh;
        }

        /* CABEÇALHO */

        header {
            background: linear-gradient(135deg, #ff4f91, #ff79aa);
            color: white;
            text-align: center;
            padding: 35px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        /* CONTEÚDO */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto;
        }

        /* CARTÃO PRINCIPAL */

        .card {
            background-color: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            margin-bottom: 30px;
            text-align: center;
        }

        .card h2 {
            color: #ed3978;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 17px;
            line-height: 1.6;
        }

        /* IMAGEM */

        .foto {
            margin: 25px auto;
        }

        .foto img {
            width: 430px;
            max-width: 100%;
            border: 6px solid #ff6fa3;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .foto img:hover {
            transform: scale(1.03);
        }

        /* TÍTULO DA TABELA */

        .titulo-tabela {
            text-align: center;
            color: #ed3978;
            font-size: 28px;
            margin: 30px 0 20px;
        }

        /* TABELA */

        .tabela {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .tabela th {
            background: linear-gradient(135deg, #ff4f91, #ff79aa);
            color: white;
            padding: 16px;
            font-size: 16px;
        }
